<!doctype html>
<!-- Desktop layout variants side by side (src/debug/layoutPreview.ts): every variant
     before a pick, then every variant with an open run. An exploration page, not part of the game. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Layout variants</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #120b10;
        --panel: #1d1218;
        --line: #3a2630;
        --text: #f7ead0;
        --muted: #c2ab8c;
        --gold: #f2c14e;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 20px 16px 40px;
        background: var(--bg);
        color: var(--text);
        font:
          15px/1.45 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }

      header {
        max-width: 1600px;
        margin: 0 auto 18px;
        display: flex;
        flex-wrap: wrap;
        align-items: end;
        justify-content: space-between;
        gap: 12px 24px;
      }

      h1 {
        margin: 0 0 4px;
        font-size: 22px;
      }

      header p {
        margin: 0;
        color: var(--muted);
      }

      .sizes {
        display: flex;
        gap: 6px;
      }

      .sizes button {
        padding: 6px 12px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--panel);
        color: var(--text);
        font: inherit;
        cursor: pointer;
      }

      .sizes button[aria-pressed='true'] {
        border-color: var(--gold);
        color: var(--gold);
      }

      main {
        max-width: 1600px;
        margin: 0 auto;
        display: grid;
        gap: 22px;
      }

      section {
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--panel);
      }

      h2 {
        margin: 0 0 12px;
        font-size: 17px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px 14px;
      }

      @media (max-width: 900px) {
        .grid {
          grid-template-columns: minmax(0, 1fr);
        }
      }

      figure {
        margin: 0;
      }

      figcaption {
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: baseline;
        gap: 10px;
        margin-bottom: 6px;
        font-size: 13px;
        color: var(--muted);
      }

      figcaption b {
        font-size: 15px;
        color: var(--gold);
      }

      figcaption a {
        color: var(--muted);
      }

      /* the frame is laid out at the real window size and scaled down to the column */
      .frame {
        position: relative;
        overflow: hidden;
        border-radius: 6px;
        background: #000;
      }

      .frame iframe {
        position: absolute;
        left: 0;
        top: 0;
        border: 0;
        transform-origin: 0 0;
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>High Noon Flip: desktop layout variants</h1>
        <p>The emblems lower, the balance higher. Landscape only; each frame is its own demo session.</p>
      </div>
      <div class="sizes" role="group" aria-label="Window size">
        <button type="button" data-size="1440x810" aria-pressed="true">Desktop 1440 × 810</button>
        <button type="button" data-size="844x390" aria-pressed="false">Phone 844 × 390</button>
      </div>
    </header>
    <main id="rows"></main>

    <script>
      const LAYOUTS = [
        {
          id: '',
          name: 'Current',
          note: 'Today: emblems at mid-height on the sides, the balance in the bottom left corner.',
        },
        {
          id: 'a',
          name: 'A',
          note: 'Emblems lower and closer to the revolver, keycaps under them; the balance in the top left corner.',
        },
        {
          id: 'b',
          name: 'B',
          note: 'Emblems in the bottom corners, keycaps on their inner side; the balance in the top left corner.',
        },
        {
          id: 'c',
          name: 'C',
          note: 'Emblems lower on the sides, keycaps under them; the balance in the top right corner under the buttons.',
        },
      ];
      const STATES = [
        { id: 'idle', name: 'Before a pick' },
        { id: 'run', name: 'Open run, cash out showing' },
      ];

      const rows = document.getElementById('rows');
      const frames = [];
      for (const state of STATES) {
        const section = document.createElement('section');
        const title = document.createElement('h2');
        title.textContent = state.name;
        const grid = document.createElement('div');
        grid.className = 'grid';
        for (const layout of LAYOUTS) {
          const q = new URLSearchParams({ compare: state.id });
          if (layout.id) q.set('layout', layout.id);
          const src = `./index.html?${q}`;
          const figure = document.createElement('figure');
          const caption = document.createElement('figcaption');
          const name = document.createElement('b');
          name.textContent = layout.id ? `Variant ${layout.name}` : layout.name;
          const note = document.createElement('span');
          note.textContent = layout.note;
          const open = document.createElement('a');
          open.href = src;
          open.target = '_blank';
          open.textContent = 'open';
          caption.append(name, note, open);
          const frame = document.createElement('div');
          frame.className = 'frame';
          const iframe = document.createElement('iframe');
          iframe.src = src;
          iframe.title = `${layout.name}: ${state.name}`;
          iframe.loading = 'lazy';
          frame.append(iframe);
          figure.append(caption, frame);
          grid.append(figure);
          frames.push(frame);
        }
        section.append(title, grid);
        rows.append(section);
      }

      let size = [1440, 810];
      function fit() {
        for (const frame of frames) {
          const scale = frame.clientWidth / size[0];
          frame.style.height = `${size[1] * scale}px`;
          const iframe = frame.firstElementChild;
          iframe.style.width = `${size[0]}px`;
          iframe.style.height = `${size[1]}px`;
          iframe.style.transform = `scale(${scale})`;
        }
      }
      new ResizeObserver(fit).observe(rows);

      for (const button of document.querySelectorAll('.sizes button')) {
        button.addEventListener('click', () => {
          size = button.dataset.size.split('x').map(Number);
          for (const b of document.querySelectorAll('.sizes button')) {
            b.setAttribute('aria-pressed', String(b === button));
          }
          fit();
        });
      }
    </script>
  </body>
</html>
